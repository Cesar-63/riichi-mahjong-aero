<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540">
  <!-- The back room floor seen from above: cheap grey tiles, no two the same
       shade, cracked and chipped, black grime packed in the grout, chair
       scrapes and years of dirt nobody mopped. 3 x 3 tiles; tiles seamlessly. -->
  <defs>
    <filter id="mottle" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="4" seed="21" stitchTiles="stitch" result="t"/>
      <feColorMatrix in="t" values="0 0 0 0 .08  0 0 0 0 .07  0 0 0 0 .05  0 0 0 1.8 -.72"/>
    </filter>
    <filter id="grit" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5" stitchTiles="stitch" result="t"/>
      <feColorMatrix in="t" values="0 0 0 0 .05  0 0 0 0 .05  0 0 0 0 .04  0 0 0 2.4 -1.3"/>
    </filter>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".2" numOctaves="2" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="3"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <g>
    <rect x="0" y="0" width="180" height="180" fill="#4a4c4d"/><rect x="180" y="0" width="180" height="180" fill="#525049"/><rect x="360" y="0" width="180" height="180" fill="#47494b"/>
    <rect x="0" y="180" width="180" height="180" fill="#4f4d48"/><rect x="180" y="180" width="180" height="180" fill="#45474a"/><rect x="360" y="180" width="180" height="180" fill="#504e4a"/>
    <rect x="0" y="360" width="180" height="180" fill="#46484a"/><rect x="180" y="360" width="180" height="180" fill="#4d4b46"/><rect x="360" y="360" width="180" height="180" fill="#3f4143"/>
  </g>
  <!-- dirt gathered towards the edges of each tile -->
  <g fill="none" stroke="#1d1c18" stroke-opacity=".35" stroke-width="22" filter="url(#soft)">
    <rect x="2" y="2" width="176" height="176"/><rect x="182" y="2" width="176" height="176"/><rect x="362" y="2" width="176" height="176"/>
    <rect x="2" y="182" width="176" height="176"/><rect x="182" y="182" width="176" height="176"/><rect x="362" y="182" width="176" height="176"/>
    <rect x="2" y="362" width="176" height="176"/><rect x="182" y="362" width="176" height="176"/><rect x="362" y="362" width="176" height="176"/>
  </g>
  <rect width="540" height="540" filter="url(#mottle)"/>
  <rect width="540" height="540" filter="url(#grit)"/>
  <!-- a tile broken in three, one shard missing: concrete underneath -->
  <path d="M360 360 L420 360 L404 392 L380 386 L372 420 L360 428 Z" fill="#2a2824" filter="url(#rough)"/>
  <path d="M420 362 L404 392 L452 470 M404 392 L380 386 L372 420" stroke="#121110" stroke-width="2" fill="none" filter="url(#rough)"/>
  <!-- a chipped corner -->
  <path d="M180 180 L206 180 L199 190 L188 193 L180 204 Z" fill="#2c2a26" filter="url(#rough)"/>
  <!-- cracks -->
  <g fill="none" stroke-linecap="round" stroke="#141310" filter="url(#rough)">
    <path d="M18 40 L52 58 L61 92 L98 104 L120 140 L150 152" stroke-width="2"/>
    <path d="M61 92 L44 120 L50 150" stroke-width="1.3"/>
    <path d="M250 230 L276 262 L270 300 L300 336" stroke-width="1.6"/>
    <path d="M276 262 L320 270" stroke-width="1"/>
    <path d="M470 20 L456 70 L478 96" stroke-width="1.2"/>
  </g>
  <!-- chair scrapes -->
  <g fill="none" stroke="#8b8a82" stroke-opacity=".15" stroke-width="2" stroke-linecap="round">
    <path d="M210 40 q40 -14 90 6"/><path d="M214 52 q40 -12 86 8"/>
    <path d="M30 400 q50 30 110 10"/><path d="M400 250 q30 40 100 30"/>
  </g>
  <!-- grime packed in the grout -->
  <g fill="#0f0e0c">
    <rect x="0" y="0" width="540" height="3"/><rect x="0" y="178" width="540" height="4"/><rect x="0" y="358" width="540" height="4"/>
    <rect x="0" y="0" width="3" height="540"/><rect x="178" y="0" width="4" height="540"/><rect x="358" y="0" width="4" height="540"/>
  </g>
  <g fill="#000" opacity=".5" filter="url(#soft)">
    <circle cx="180" cy="180" r="10"/><circle cx="360" cy="180" r="8"/><circle cx="180" cy="360" r="9"/><circle cx="360" cy="360" r="11"/>
    <circle cx="0" cy="180" r="9"/><circle cx="540" cy="180" r="9"/><circle cx="0" cy="360" r="8"/><circle cx="540" cy="360" r="8"/>
    <circle cx="180" cy="0" r="9"/><circle cx="180" cy="540" r="9"/><circle cx="360" cy="0" r="8"/><circle cx="360" cy="540" r="8"/>
  </g>
</svg>
