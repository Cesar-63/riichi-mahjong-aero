<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- A cheap tin ashtray seen from above, overflowing. -->
  <defs>
    <radialGradient id="rim" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#bdb8ad"/><stop offset=".6" stop-color="#6b675f"/><stop offset="1" stop-color="#2a2824"/></radialGradient>
    <radialGradient id="bowl" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#5a5650"/><stop offset="1" stop-color="#22201c"/></radialGradient>
    <linearGradient id="filt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2b46e"/><stop offset="1" stop-color="#9c6f33"/></linearGradient>
    <linearGradient id="pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1ece0"/><stop offset="1" stop-color="#b9b2a2"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="sh"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <ellipse cx="64" cy="66" rx="48" ry="48" fill="#000" opacity=".6" filter="url(#sh)"/>
  <circle cx="60" cy="60" r="46" fill="url(#rim)"/>
  <circle cx="60" cy="60" r="36" fill="url(#bowl)"/>
  <!-- rests in the rim -->
  <g fill="#2a2824"><rect x="55" y="12" width="10" height="12" rx="4"/><rect x="55" y="96" width="10" height="12" rx="4"/><rect x="12" y="55" width="12" height="10" rx="4"/><rect x="96" y="55" width="12" height="10" rx="4"/></g>
  <!-- ash heap and butts -->
  <ellipse cx="58" cy="62" rx="26" ry="22" fill="#9a968e" opacity=".75" filter="url(#blur)"/>
  <ellipse cx="66" cy="54" rx="12" ry="9" fill="#c4c0b6" opacity=".5" filter="url(#blur)"/>
  <g transform="rotate(25 50 50)"><rect x="34" y="46" width="14" height="7" rx="1.5" fill="url(#filt)"/><rect x="48" y="46" width="10" height="7" fill="url(#pap)"/><path d="M58 46 h3 q3 3.5 0 7 h-3 z" fill="#2a2724"/></g>
  <g transform="rotate(-40 70 70)"><rect x="62" y="66" width="14" height="7" rx="1.5" fill="url(#filt)"/><rect x="76" y="66" width="8" height="7" fill="url(#pap)"/><path d="M84 66 h3 q3 3.5 0 7 h-3 z" fill="#2a2724"/></g>
  <g transform="rotate(100 60 80)"><rect x="52" y="77" width="14" height="7" rx="1.5" fill="url(#filt)"/><rect x="66" y="77" width="11" height="7" fill="url(#pap)"/></g>
  <!-- one still lying across the rest, smoke-stained -->
  <g transform="rotate(-8 90 30)"><rect x="70" y="24" width="15" height="7" rx="1.5" fill="url(#filt)"/><rect x="85" y="24" width="26" height="7" fill="url(#pap)"/><path d="M111 24 h4 q3 3.5 0 7 h-4 z" fill="#5a5650"/></g>
  <circle cx="60" cy="60" r="46" fill="none" stroke="#000" stroke-opacity=".5"/>
</svg>
