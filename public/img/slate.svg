<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400">
  <!-- A slate chalkboard wiped badly too many times: broad eraser swipes of
       chalk dust, a few ghosts of old tallies, fine grit. Overlay on the
       board colour; tiles seamlessly except the ghost marks. -->
  <defs>
    <filter id="swipe" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency=".003 .018" numOctaves="4" seed="13" stitchTiles="stitch" result="t"/>
      <feColorMatrix in="t" values="0 0 0 0 .92  0 0 0 0 .92  0 0 0 0 .88  0 0 0 1.5 -.62"/>
    </filter>
    <filter id="grit" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" stitchTiles="stitch" result="t"/>
      <feColorMatrix in="t" values="0 0 0 0 .9  0 0 0 0 .9  0 0 0 0 .85  0 0 0 3 -1.9"/>
    </filter>
    <filter id="ghost" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="2" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>
  <rect width="520" height="400" filter="url(#swipe)" opacity=".22"/>
  <rect width="520" height="400" filter="url(#grit)" opacity=".1"/>
  <!-- old tallies and a sum nobody paid, half rubbed out -->
  <g filter="url(#ghost)" stroke="#e8e4d8" stroke-opacity=".07" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M60 300 v28 M70 300 v28 M80 300 v28 M90 300 v28 M54 322 l44 -16"/>
    <path d="M380 70 q20 -16 34 0 t30 4 M372 96 h86"/>
    <path d="M300 330 l30 -30 m-30 0 l30 30"/>
  </g>
</svg>
