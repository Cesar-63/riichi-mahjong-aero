<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220">
  <!-- An enamel pendant shade over the table, lit from inside: chipped green
       enamel, a dented brass cap, the bulb glowing under the rim. -->
  <defs>
    <linearGradient id="enamel" x1="0" x2="1">
      <stop offset="0" stop-color="#0d1510"/>
      <stop offset=".18" stop-color="#2c4636"/>
      <stop offset=".3" stop-color="#4a6a55"/>
      <stop offset=".42" stop-color="#2a4232"/>
      <stop offset=".75" stop-color="#16231b"/>
      <stop offset="1" stop-color="#080d0a"/>
    </linearGradient>
    <linearGradient id="shadeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffd9a6" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" x2="1">
      <stop offset="0" stop-color="#2a2014"/>
      <stop offset=".35" stop-color="#8a6a3a"/>
      <stop offset=".5" stop-color="#5e4625"/>
      <stop offset="1" stop-color="#1c150c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" x2="1">
      <stop offset="0" stop-color="#1a241d"/>
      <stop offset=".3" stop-color="#6a7f6d"/>
      <stop offset=".55" stop-color="#3a4d40"/>
      <stop offset="1" stop-color="#0f1611"/>
    </linearGradient>
    <radialGradient id="inside" cx=".5" cy=".35" r=".6">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".22" stop-color="#ffe9c4"/>
      <stop offset=".6" stop-color="#ffd9a6"/>
      <stop offset="1" stop-color="#9c6a34"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd9a6" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#ffd9a6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffd9a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="wear" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix in="n" values="0 0 0 0 .05  0 0 0 0 .04  0 0 0 0 .02  0 0 0 2.6 -1.5"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="rust" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" values="0 0 0 0 .2  0 0 0 0 .12  0 0 0 0 .05  0 0 0 3 -1.95"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
    <clipPath id="shadeClip"><path id="shadeShape" d="M136 46 C136 46 132 58 118 70 C96 88 56 104 34 140 L286 140 C264 104 224 88 202 70 C188 58 184 46 184 46 Z"/></clipPath>
  </defs>

  <!-- glow spilling under and around the shade -->
  <ellipse cx="160" cy="150" rx="160" ry="62" fill="url(#halo)"/>

  <!-- cap and socket -->
  <rect x="152" y="0" width="16" height="22" fill="url(#brass)"/>
  <path d="M146 22 H174 L178 36 H142 Z" fill="url(#brass)"/>
  <rect x="140" y="36" width="40" height="11" rx="2" fill="url(#brass)"/>
  <path d="M142 38 H178" stroke="#000" stroke-opacity=".5"/>

  <!-- the shade -->
  <g clip-path="url(#shadeClip)">
    <rect x="30" y="40" width="260" height="104" fill="url(#enamel)"/>
    <rect x="30" y="40" width="260" height="104" fill="url(#shadeDark)"/>
    <!-- a soft highlight down the left flank -->
    <path d="M128 52 C116 72 84 92 64 128" stroke="#cfe0d2" stroke-opacity=".22" stroke-width="7" fill="none" filter="url(#soft)"/>
    <rect x="30" y="40" width="260" height="104" filter="url(#rust)" opacity=".55"/>
    <rect x="30" y="40" width="260" height="104" filter="url(#wear)" opacity=".7"/>
    <!-- chipped enamel -->
    <path d="M214 96 q5 -3 8 2 q-2 5 -7 4 z M92 116 q4 -2 6 1 q-1 4 -5 3 z M240 118 q6 -1 7 4 q-4 3 -8 0 z" fill="#0a0806" opacity=".85"/>
  </g>

  <!-- the rolled rim -->
  <path d="M30 140 C60 134 260 134 290 140 C292 146 288 150 284 151 C250 145 70 145 36 151 C32 150 28 146 30 140 Z" fill="url(#rim)"/>
  <!-- the lit inside of the shade, seen from just below -->
  <ellipse cx="160" cy="151" rx="124" ry="11" fill="url(#inside)"/>
  <ellipse cx="160" cy="150" rx="34" ry="6" fill="#fffdf6" opacity=".9" filter="url(#soft)"/>
</svg>
