<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The ring a tea cup left: uneven, darker at its rim, with a faint drip. -->
  <defs>
    <filter id="wobble" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="3" seed="8" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation=".7"/>
    </filter>
    <radialGradient id="pool"><stop offset=".7" stop-color="#7a5420" stop-opacity="0"/><stop offset=".95" stop-color="#7a5420" stop-opacity=".1"/><stop offset="1" stop-color="#7a5420" stop-opacity="0"/></radialGradient>
  </defs>
  <g filter="url(#wobble)">
    <circle cx="60" cy="60" r="44" fill="url(#pool)"/>
    <circle cx="60" cy="60" r="43" fill="none" stroke="#6b4518" stroke-opacity=".26" stroke-width="2.2" stroke-dasharray="180 14 60 8"/>
    <circle cx="61" cy="59" r="40" fill="none" stroke="#6b4518" stroke-opacity=".09" stroke-width="5"/>
    <path d="M98 78 q6 6 4 14" stroke="#6b4518" stroke-opacity=".16" stroke-width="2" fill="none"/>
  </g>
</svg>
